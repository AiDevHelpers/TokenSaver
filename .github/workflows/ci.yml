name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Add package feeds
        shell: pwsh
        env:
          NUGET_READ_TOKEN: ${{ secrets.TOKENSAVER_READ_TOKEN }}
        run: |
          if (-not $env:NUGET_READ_TOKEN) {
            throw "TOKENSAVER_READ_TOKEN is not set. It must be a classic PAT with read:packages."
          }
          dotnet nuget add source "https://nuget.pkg.github.com/rsperry79/index.json" --name github --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text
          dotnet nuget add source "https://nuget.pkg.github.com/AiDevHelpers/index.json" --name aidevhelpers --username rsperry79 --password $env:NUGET_READ_TOKEN --store-password-in-clear-text
      - name: Restore and build solution
        run: dotnet build TokenSaver.slnx -c Release
